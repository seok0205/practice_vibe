# ==============================================================================
# [파일 목적]
# Vibe Lotto 6/45 백엔드의 비민감(Non-sensitive) 환경설정과 MySQL 접속 계정(Secret)을
# 컨테이너 이미지로부터 분리하여 주입하기 위한 ConfigMap 및 Secret 매니페스트입니다.
#
# [아키텍처 내 역할]
# - 12-Factor App 원칙에 따라 코드/이미지를 다시 빌드하지 않고도 환경변수(DB 호스트, 앱 버전 등)를
#   변경할 수 있게 해줍니다.
# - `vibe-lotto-config` (ConfigMap): 평문으로 관리해도 무방한 설정(DB 호스트명, 포트, 앱 이름 등)
# - `vibe-lotto-secret` (Secret): 외부에 노출되면 안 되는 민감 정보(MySQL root 비밀번호, 앱 DB 비밀번호)
#
# [연관 리소스]
# - `02-mysql.yaml`의 MySQL 파드와 `03-backend-deployment.yaml`의 백엔드 파드에서
#   `envFrom` 또는 `valueFrom.secretKeyRef`를 통해 이 리소스들의 값을 참조합니다.
#
# [CKA 시험 포인트]
# - Secret의 `data` 필드는 Base64 인코딩된 문자열을 요구하지만, `stringData` 필드를 사용하면
#   평문으로 작성해도 Kubernetes API 서버가 저장 시 자동으로 Base64로 인코딩해 줍니다!
# - 주의: Base64는 암호화(Encryption)가 아닌 단순 인코딩이므로, 실무에서는 RBAC으로 Secret 조회 권한을
#   제한하거나 etcd 암호화(EncryptionConfiguration)를 함께 사용합니다.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-lotto-config
  # namespace: 생략 시 기본값(Default)은 'default' 네임스페이스이므로 반드시 명시합니다.
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: vibe-lotto
data:
  # 백엔드 애플리케이션(`app/backend/app/core/config.py`)이 읽어들일 환경변수 Key-Value 쌍입니다.
  APP_NAME: "Vibe Lotto 6/45 (K8s)"
  APP_VERSION: "1.3.0"
  APP_ENV: "k8s-dev"
  LOTTO_STORAGE_BACKEND: "mysql"
  # DB_HOST: Kubernetes 내부 CoreDNS를 통해 같은 네임스페이스의 'mysql-service' Service 이름으로 통신합니다!
  #          (전체 FQDN인 'mysql-service.vibe-lotto.svc.cluster.local'로 적어도 동일하게 동작합니다.)
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "vibe_lotto"
  LOTTO_MAX_HISTORY_ITEMS: "50"
---
apiVersion: v1
kind: Secret
metadata:
  name: vibe-lotto-secret
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: vibe-lotto
# type: 생략 시 기본값(Default)은 'Opaque'(일반적인 임의의 Key-Value 시크릿)입니다.
#       그 외에 TLS 인증서용 'kubernetes.io/tls', Docker 레지스트리용 'kubernetes.io/dockerconfigjson' 등이 있습니다.
type: Opaque
# stringData: 평문으로 작성하면 K8s에 적용될 때 자동으로 base64로 변환되어 `data` 필드에 저장됩니다.
stringData:
  MYSQL_ROOT_PASSWORD: "root_secret_password"
  DB_USER: "lotto_user"
  DB_PASSWORD: "lotto_pass"

