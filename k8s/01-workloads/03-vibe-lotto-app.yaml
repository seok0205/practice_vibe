# ==============================================================================
# [파일 목적]
# 우리가 직접 작성한 Vibe Lotto 6/45 풀스택 애플리케이션(FastAPI + React)을
# 다중 레플리카(Replicas: 2)로 무중단 배포하고 외부에서 접근할 수 있도록 노출하는
# Deployment 및 Service 매니페스트입니다.
#
# [아키텍처 내 역할 & 핵심 학습 포인트]
# 1. `initContainers (wait-for-mysql)`:
#    - 메인 애플리케이션 컨테이너가 시작되기 전에 먼저 실행되어, `mysql-service:3306`이
#      실제 연결을 받을 수 있을 때까지 대기합니다. (CKA 단골 출제 패턴!)
# 2. `replicas: 2` & `RollingUpdate`:
#    - 2개의 파드를 동시에 띄워 고가용성(HA)을 확보하고, 웹 화면 상단 상태바의
#      `Pod: vibe-lotto-app-...` 호스트네임이 요청마다 바뀌는 로드밸런싱을 눈으로 확인합니다.
# 3. `securityContext`:
#    - `Dockerfile`에서 생성한 비특권 유저(UID 10001)로 실행을 강제하여 보안 모범 사례를 준수합니다.
# 4. `livenessProbe` & `readinessProbe`:
#    - `/api/v1/health/live`와 `/api/v1/health/ready`(MySQL DB 연결 점검 포함)를 주기적으로 호출하여
#      정상 상태인 파드로만 트래픽을 라우팅합니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Vibe Lotto Application Deployment
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-lotto-app
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: vibe-lotto-app
    tier: backend
spec:
  # replicas: 2개의 파드를 실행하여 워커 노드 간 부하 분산(Load Balancing) 및 무중단 배포를 실습합니다.
  replicas: 2
  # revisionHistoryLimit: 롤백(`kubectl rollout undo`)을 위해 보관할 이전 ReplicaSet 이력 개수입니다.
  # 생략 시 기본값(Default)은 10입니다.
  revisionHistoryLimit: 5
  # strategy: 새 버전 배포 시 파드 교체 방식입니다. (생략 시 기본값은 RollingUpdate)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 업데이트 중 목표 replicas(2개)보다 추가로 더 띄울 수 있는 최대 파드 수 (기본값: 25%)
      maxSurge: 1
      # maxUnavailable: 업데이트 중 동시에 중단될 수 있는 최대 파드 수 (0으로 설정 시 최소 2개 파드 항상 유지 보장)
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vibe-lotto-app
      tier: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibe-lotto-app
        tier: backend
    spec:
      # Pod-level SecurityContext: 파드 내 모든 컨테이너에 적용되는 보안 컨텍스트입니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # ------------------------------------------------------------------------
      # initContainers: 메인 컨테이너가 기동되기 전에 순차적으로 실행되어 완료(Exit 0)되어야 하는 초기화 컨테이너입니다.
      # CKA 핵심 포인트: InitContainer가 성공적으로 종료되기 전까지 메인 컨테이너는 'Init:0/1' 상태로 대기합니다.
      # ------------------------------------------------------------------------
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for mysql-service:3306 to be ready..."
              until nc -z -v -w2 mysql-service 3306; do
                echo "MySQL is not ready yet. Sleeping 2s..."
                sleep 2
              done
              echo "MySQL is up and accepting connections!"
      # ------------------------------------------------------------------------
      # Main Application Container
      # ------------------------------------------------------------------------
      containers:
        - name: vibe-lotto
          # 로컬에서 빌드하여 Kind 클러스터에 로드(`kind load docker-image`)할 이미지 태그입니다.
          image: vibe-lotto:1.0.0
          # 주의: 로컬에서 직접 넣은 이미지를 사용할 때는 원격 Docker Hub에서 찾으려다 'ErrImagePull'이
          #       발생하지 않도록 반드시 'IfNotPresent' 또는 'Never'로 설정해야 합니다!
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # envFrom: ConfigMap의 모든 Key-Value 쌍을 한 번에 컨테이너 환경변수로 주입합니다.
          envFrom:
            - configMapRef:
                name: vibe-lotto-config
          # env: Secret에서 민감한 DB 계정 정보만 선별하여 환경변수로 주입합니다.
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vibe-lotto-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibe-lotto-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # readinessProbe: FastAPI 서버가 기동되고 MySQL DB(`SELECT 1`) 연결까지 성공했는지 검사합니다.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe: FastAPI 이벤트 루프가 살아있는지 검사합니다.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
# ------------------------------------------------------------------------------
# 2. Vibe Lotto Service (NodePort) - 외부 및 클러스터 내부 트래픽 로드밸런싱
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: vibe-lotto-service
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: vibe-lotto-app
spec:
  # type: NodePort를 사용하면 클러스터 내부 IP(ClusterIP)뿐만 아니라 모든 노드의 고정 포트(30000~32767)를 열어
  #       외부에서도 접속할 수 있게 합니다. (Module 4에서는 여기에 Ingress를 연결할 예정입니다.)
  type: NodePort
  selector:
    app.kubernetes.io/name: vibe-lotto-app
    tier: backend
  ports:
    - name: http
      protocol: TCP
      # port: 클러스터 내부에서 다른 파드가 호출할 때 쓰는 Service 포트 (80)
      port: 80
      # targetPort: 컨테이너가 실제로 듣고 있는 포트 (8000)
      targetPort: 8000
      # nodePort: 노드에 개방할 포트 번호 (범위: 30000 ~ 32767, 생략 시 범위 내에서 임의 자동 할당)
      nodePort: 30080

