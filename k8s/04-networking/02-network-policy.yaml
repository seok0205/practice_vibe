# ==============================================================================
# [파일 목적]
# 클러스터 내부의 데이터베이스(`mysql` 파드)에 허가된 파드(`vibe-lotto-app` 및 배치 `Job`)만
# 3306 포트로 접근할 수 있도록 네트워크 방화벽을 세우는 `NetworkPolicy` 매니페스트입니다.
#
# [아키텍처 내 역할 & 왜 필요한가? (Zero-Trust Security)]
# - Kubernetes의 기본 네트워크 정책은 **"All-Allow(모든 파드 간 통신 100% 허용)"**입니다!
# - 즉, 별도의 `NetworkPolicy`가 없으면 다른 네임스페이스에 있는 해커의 파드나 전혀 관계없는
#   프론트엔드/모니터링 파드에서도 `mysql-service.vibe-lotto.svc.cluster.local:3306`으로
#   직접 DB 접속을 시도할 수 있습니다.
# - `NetworkPolicy`는 L3/L4(IP 및 포트, 파드/네임스페이스 라벨) 수준에서 파드 앞단의 방화벽(iptables/eBPF)을
#   제어하여 **최소 권한 통신(Least Privilege Networking)**을 구현합니다.
#
# [CKA 시험 1순위 출제 포인트 (매우 중요!)]
# 1. `podSelector` (spec 바로 아래): 이 방화벽 정책을 **"어느 파드에게 적용할 것인가(보호 대상)"**를 지정합니다.
#    - 만약 `podSelector: {}` (빈 중괄호)로 쓰면 해당 네임스페이스의 **모든 파드**가 대상이 됩니다!
# 2. `policyTypes`: `Ingress`(들어오는 트래픽), `Egress`(나가는 트래픽) 중 무엇을 통제할지 명시합니다.
#    - 특정 파드에 대해 NetworkPolicy가 생성되는 순간, 허용 목록(`from` / `to`)에 적히지 않은
#      모든 트래픽은 **자동으로 차단(Default Deny)**됩니다!
# 3. `from` 배열의 **AND 조건 vs OR 조건** (CKA 최대 함정!):
#    - `- namespaceSelector: ...` 와 `podSelector: ...` 사이에 대시(`-`)가 **없으면** **AND 조건** (해당 네임스페이스 안에 있는 해당 파드만 허용)
#    - 둘 앞에 각각 대시(`-`)가 **있으면** **OR 조건** (해당 네임스페이스의 모든 파드 OR 같은 네임스페이스의 해당 파드 허용)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-access-policy
  # 주의: NetworkPolicy는 반드시 보호하려는 대상 파드(mysql)가 속한 네임스페이스에 생성해야 합니다!
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: mysql-access-policy
spec:
  # ----------------------------------------------------------------------------
  # 1. 보호 대상 파드 지정 (Target Pods)
  # 'app.kubernetes.io/name=mysql' 및 'tier=database' 라벨을 가진 MySQL 파드에 이 방화벽을 씌웁니다.
  # ----------------------------------------------------------------------------
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
      tier: database

  # ----------------------------------------------------------------------------
  # 2. 통제할 트래픽 방향 (Policy Types)
  # MySQL 파드로 들어오는 요청(Ingress)만 통제합니다.
  # ----------------------------------------------------------------------------
  policyTypes:
    - Ingress

  # ----------------------------------------------------------------------------
  # 3. 인바운드(Ingress) 화이트리스트 규칙 (여기에 명시되지 않은 파드의 접근은 모두 Drop!)
  # ----------------------------------------------------------------------------
  ingress:
    - from:
        # 허용 그룹 1: 같은 네임스페이스(vibe-lotto) 내의 백엔드 애플리케이션 파드 ('tier: backend')
        - podSelector:
            matchLabels:
              tier: backend
        # 허용 그룹 2: Module 3에서 만든 통계 리포트 Job 파드 ('job-name: lotto-stats-report')
        - podSelector:
            matchLabels:
              job-name: lotto-stats-report
        # 허용 그룹 3: Module 3 & Module 5의 배치/백업 Job 및 CronJob 파드 ('tier: batch-audit' 또는 'app.kubernetes.io/name: lotto-periodic-audit')
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lotto-periodic-audit
        - podSelector:
            matchLabels:
              tier: batch-audit
      # 허용할 프로토콜 및 포트 번호 (TCP 3306 포트만 개방)
      ports:
        - protocol: TCP
          port: 3306

