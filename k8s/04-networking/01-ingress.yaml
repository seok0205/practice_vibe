# ==============================================================================
# [파일 목적]
# `kubectl port-forward`를 매번 켜지 않고도 외부(내 Mac 브라우저 `http://localhost` 또는
# `http://lotto.vibe.local`)에서 HTTP(L7) 도메인 및 경로 기반으로 Vibe Lotto 6/45 서비스에
# 상시 접속할 수 있도록 해주는 Kubernetes Ingress 매니페스트입니다.
#
# [아키텍처 내 역할 & 왜 필요한가?]
# - `Service (NodePort / LoadBalancer)`는 L4(TCP/UDP) 계층에서 동작하므로 도메인 이름(`host`)이나
#   URL 경로(`/api`, `/`)에 따른 조건부 라우팅, SSL/TLS 인증서 종료(Termination)를 처리할 수 없습니다.
# - `Ingress`는 클러스터 앞단에 위치한 **NGINX Ingress Controller**에게 "어떤 도메인/경로로 들어온
#   HTTP 요청을 어느 내부 Service로 넘겨줄지"에 대한 라우팅 규칙(Rule)을 선언합니다.
#
# [연관 리소스]
# - `k8s/00-cluster/kind-config.yaml`에서 Control Plane 노드의 80/443 포트를 내 Mac의 80/443 포트와
#   연결(`extraPortMappings`)해 두었으며, `ingress-ready=true` 라벨을 부여해 두었습니다.
# - 따라서 NGINX Ingress Controller를 설치한 후 이 Ingress를 적용하면, 포트포워딩 없이도
#   즉시 `http://localhost`로 접속이 가능해집니다!
#
# [CKA 시험 필수 포인트]
# - Ingress 리소스를 만들 때 **`ingressClassName: nginx`**와 경로 매칭 방식인
#   **`pathType: Prefix` (또는 `Exact`)**는 생략하면 에러가 나거나 동작하지 않는 필수 필드입니다!
# - 명령형(Imperative) 생성 단축 명령어 (시험 시간 5분 단축 치트키!):
#   `kubectl create ingress vibe-lotto-ingress --class=nginx --rule="lotto.vibe.local/*=vibe-lotto-service:80" --dry-run=client -o yaml`
# ==============================================================================

# apiVersion: Ingress는 Kubernetes 1.19+부터 'networking.k8s.io/v1'을 표준으로 사용합니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibe-lotto-ingress
  namespace: vibe-lotto
  labels:
    app.kubernetes.io/name: vibe-lotto-ingress
  annotations:
    # NGINX Ingress Controller 전용 설정 어노테이션입니다.
    # proxy-read-timeout: 백엔드 응답 대기 시간(초) 설정 (기본값: 60)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  # ingressClassName: 클러스터 내에 여러 Ingress Controller가 있을 때 어느 컨트롤러가
  #                   이 Ingress 규칙을 처리할지 지정합니다. (CKA 시험에서 반드시 확인해야 하는 필드!)
  ingressClassName: nginx

  # rules: 도메인(host) 및 URL 경로(path)별 L7 라우팅 규칙 목록입니다.
  rules:
    # --------------------------------------------------------------------------
    # 규칙 1: 도메인 지정 없이 `http://localhost` (또는 모든 호스트 헤더)로 접속했을 때의 기본 규칙
    # --------------------------------------------------------------------------
    - http:
        paths:
          - path: /
            # pathType: 경로 매칭 방식입니다. (필수 지정, 생략 불가!)
            # - Prefix: '/'로 시작하는 모든 하위 경로(/, /assets/*, /api/v1/*)를 매칭합니다.
            # - Exact: 정확히 해당 경로 문자열과 100% 일치할 때만 매칭합니다.
            pathType: Prefix
            backend:
              service:
                # name: 트래픽을 전달할 내부 Service 이름 (`k8s/01-workloads/03-vibe-lotto-app.yaml`에서 생성)
                name: vibe-lotto-service
                port:
                  # number: 해당 Service가 열고 있는 포트 번호 (vibe-lotto-service의 port는 80)
                  number: 80

    # --------------------------------------------------------------------------
    # 규칙 2: 가상 도메인 `http://lotto.vibe.local`로 접속했을 때의 라우팅 규칙 (실무 도메인 분리 패턴)
    # --------------------------------------------------------------------------
    - host: lotto.vibe.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibe-lotto-service
                port:
                  number: 80

